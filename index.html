            function toDateStr(value){if(value===null||value===undefined||value==="")return null;if(value instanceof Date&&!isNaN(value.getTime())){return value.getFullYear()+'-'+(value.getMonth()+1).toString().padStart(2,'0')+'-'+value.getDate().toString().padStart(2,'0');}if(typeof value==='number'&&!isNaN(value)&&value>0){const date=new Date(1899,11,30);date.setTime(date.getTime()+value*86400000);if(!isNaN(date.getTime()))return date.toISOString().slice(0,10);}let str=String(value).trim();if(str==="")return null;let match=str.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(match)return match[1]+'-'+match[2].padStart(2,'0')+'-'+match[3].padStart(2,'0');let d=new Date(str);if(!isNaN(d.getTime()))return d.toISOString().slice(0,10);return null;}
            function getYearFromDateStr(dateStr){if(!dateStr)return null;let parts=dateStr.split('-');if(parts.length>=1)return parseInt(parts[0]);return null;}

            function evaluateIndoor(rowMap){const coverScene=rowMap["覆盖场景"]||"";const landArea=parseFloat(rowMap["新区占地面积(万平方米)"]);const flatCover=parseFloat(rowMap["平层覆盖面积(万平方米)"]);const containsResident=coverScene.includes("居民")||coverScene.includes("住宅");if(containsResident)return(!isNaN(landArea)&&landArea>=1)?"符合原则":"";else return(!isNaN(flatCover)&&flatCover>=1)?"符合原则":"";}
            function evaluateOutdoor(rowMap){const landArea=parseFloat(rowMap["新区占地面积(万平方米)"]);if(isNaN(landArea)||landArea<4)return"";const regionType=rowMap["区域类型"]||"";const distance=parseFloat(rowMap["最近宏站物理站距离(米)"]);if(isNaN(distance))return"";let ok=false;if(regionType==="一类区域"||regionType==="二类区域")ok=distance>=200;else if(regionType==="三类区域")ok=distance>=300;else if(regionType==="四类区域")ok=distance>=400;return ok?"符合原则":"";}

            const idx = lowerHeaders.findIndex(h => h === lowerTarget);

    // 将各种可能的交付时间值转换为Date对象（用于比较）
    function convertToDate(value) {
        if (!value && value !== 0) return null;
        // 已是Date对象
        if (value instanceof Date) return value;
        // Excel序列号数字
        if (typeof value === 'number') {
            const date = XLSX.SSF.parse_date_code(value);
            if (date && date.y) {
                return new Date(date.y, date.m - 1, date.d);
            }

        // 字符串
        const str = String(value).trim();
        if (str === "") return null;
        // 尝试解析为数字（Excel序列号字符串）
        if (/^\d+$/.test(str) && str.length >= 5) {
            const num = parseInt(str, 10);
            if (!isNaN(num)) {
                const date = XLSX.SSF.parse_date_code(num);
                if (date && date.y) {
                    return new Date(date.y, date.m - 1, date.d);
                }
            }
        }

            };
            reader.onerror = (err) => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    async function loadProblemWorkbook(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                let wb;
                try {
                    wb = XLSX.read(data, { type: 'array' });
                } catch(err) {
                    reject(new Error("解析失败：" + err.message));
                    return;
                }
                const problemSheet = wb.Sheets["问题区域列表"];
                const planSheet = wb.Sheets["规划方案列表"];
                if (!problemSheet) reject(new Error("缺少工作表「问题区域列表」"));
                if (!planSheet) reject(new Error("缺少工作表「规划方案列表」"));
                const problemArr = sheetToArray(problemSheet);
                const planArr = sheetToArray(planSheet);
                if (problemArr.length < 1 || planArr.length < 1) reject(new Error("工作表为空"));
                problemWorkbook = wb;
                problemListArray = problemArr;
                planListArray = planArr;
                resolve({ problemHeaders: problemArr[0], planHeaders: planArr[0] });
            };
            reader.onerror = (err) => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    // ========= 基础匹配 =========
    function generateBasicRows() {
        if (!outputSheet1Array || !districtSheetArray) {
            throw new Error("输出结果表或新区数据表未加载");
        }
        const sheet1Headers = outputSheet1Array[0].map(h => String(h).trim());
        const sheet1DataRows = outputSheet1Array.slice(1);
        
        const districtHeaders = districtSheetArray[0].map(h => String(h).trim());
        const districtIdxMap = {};
        districtHeaders.forEach((h, idx) => { districtIdxMap[h] = idx; });
        const numberIdx = findColumnIndex(districtHeaders, ["编号", "新区编号"]);
        if (numberIdx === -1) throw new Error("新区数据表中无「编号」列");
        
        const indoorOutdoorIdx = findColumnIndex(districtHeaders, ["室内室外", "室内外", "场景类型"]);
        if (indoorOutdoorIdx === -1) setLog("警告: 新区数据表中未找到「室内室外」列，新区类型将为空");
        
        const districtMap = new Map();
        for (let i = 1; i < districtSheetArray.length; i++) {
            const row = districtSheetArray[i];
            const key = numberIdx < row.length ? String(row[numberIdx]).trim() : "";
            if (key) districtMap.set(key, row);
        }
        
        const fieldsToFetch = [
            { target: "区域类型", source: "区域类型" },
            { target: "新区名称", source: "新区名称" },
            { target: "覆盖场景", source: "覆盖场景" },
            { target: "地市", source: "地市" },
            { target: "县市", source: "县市" },
            { target: "交付时间", source: "交付时间" },
            { target: "制式", source: "制式" },
            { target: "需求库序号", source: "需求库序号" }
        ];
        const sheet2HeaderIdx = {};
        FIXED_SHEET2_HEADERS.forEach((h, idx) => { sheet2HeaderIdx[h] = idx; });
        
        const copyColumns = FIXED_SHEET2_HEADERS.filter(col => 
            sheet1Headers.includes(col) && col !== "需求ID" && col !== "端到端ID"
        );
        const sheet1IdxMap = {};
        sheet1Headers.forEach((h, idx) => { sheet1IdxMap[h] = idx; });
        
        const basicRows = [];
        for (let i = 0; i < sheet1DataRows.length; i++) {
            const sourceRow = sheet1DataRows[i];
            const newRow = new Array(FIXED_SHEET2_HEADERS.length).fill("");
            
            for (let col of copyColumns) {
                const srcIdx = sheet1IdxMap[col];
                const tgtIdx = sheet2HeaderIdx[col];
                if (srcIdx !== undefined && tgtIdx !== undefined) {
                    let val = srcIdx < sourceRow.length ? sourceRow[srcIdx] : "";
                    if (val !== undefined && val !== null) newRow[tgtIdx] = val;
                }
            }
            
            // 需求ID和端到端ID
            const reqIdIdx = sheet2HeaderIdx["需求ID"];
            const endToEndIdx = sheet2HeaderIdx["端到端ID"];
            let reqIdValue = "";
            const srcReqIdIdx = findColumnIndex(sheet1Headers, ["需求ID", "需求编号"]);
            if (srcReqIdIdx !== -1 && srcReqIdIdx < sourceRow.length) {
                reqIdValue = sourceRow[srcReqIdIdx];
                if (reqIdValue !== undefined && reqIdValue !== null) reqIdValue = String(reqIdValue);
            }
            if (reqIdIdx !== undefined) newRow[reqIdIdx] = reqIdValue;
            if (endToEndIdx !== undefined) newRow[endToEndIdx] = reqIdValue;
            
            let districtNo = "";
            const noIdx = sheet2HeaderIdx["新区编号"];
            if (noIdx !== undefined && newRow[noIdx]) {
                districtNo = String(newRow[noIdx]).trim();
            } else {
                const srcNoIdx = findColumnIndex(sheet1Headers, ["新区编号", "编号"]);
                if (srcNoIdx !== -1) districtNo = String(sourceRow[srcNoIdx] || "").trim();
            }
            
            if (districtNo && districtMap.has(districtNo)) {
                const districtRow = districtMap.get(districtNo);
                const newTypeIdx = sheet2HeaderIdx["新区类型"];
                if (newTypeIdx !== undefined && indoorOutdoorIdx !== -1) {
                    let val = indoorOutdoorIdx < districtRow.length ? districtRow[indoorOutdoorIdx] : "";
                    if (val !== undefined && val !== null) newRow[newTypeIdx] = val;
                }
                for (let field of fieldsToFetch) {
                    const tgtIdx = sheet2HeaderIdx[field.target];
                    if (tgtIdx !== undefined && districtIdxMap[field.source] !== undefined) {
                        let val = districtRow[districtIdxMap[field.source]];
                        if (val instanceof Date) val = XLSX.SSF.format("yyyy-mm-dd", val);
                        if (val !== undefined && val !== null) newRow[tgtIdx] = val;
                    }
                }
            }
            basicRows.push(newRow);
        }
        setLog('基础匹配生成 ' + basicRows.length + ' 行');
        return basicRows;
    }
    
    // ========= 补充匹配（日期范围筛选） =========
    function generateSupplementaryRows() {
        if (!problemListArray || !planListArray || !districtSheetArray) {
            throw new Error("问题区域数据或新区数据表未加载");
        }
        
        // 获取用户选择的日期范围
        let startDateStr = startDateInput.value;
        let endDateStr = endDateInput.value;
        if (!startDateStr || !endDateStr) {
            setLog("请完整填写开始日期和结束日期", true);
            return [];
        }
        const startDate = new Date(startDateStr);
        const endDate = new Date(endDateStr);
        if (isNaN(startDate.getTime()) || isNaN(endDate.getTime())) {
            setLog("日期格式无效", true);
            return [];
        }
        // 设置结束日期为当天结束（23:59:59.999）以便包含整天
        endDate.setHours(23, 59, 59, 999);
        setLog('补充匹配-交付日期筛选范围: ' + startDateStr + ' 至 ' + endDateStr);
        
        const problemHeaders = problemListArray[0].map(h => String(h).trim());
        const unicodeIdx = findColumnIndex(problemHeaders, ["UNICODE", "unicode", "编码", "新区编码", "问题编码"]);
        if (unicodeIdx === -1) throw new Error("问题区域列表中未找到「UNICODE」列");
        
        const auditResultIdx = findColumnIndex(problemHeaders, ["审核结果", "审核结论", "结果"]);
        if (auditResultIdx === -1) setLog("警告: 问题区域列表中未找到「审核结果」列，将不会筛除取消方案记录", false);
        
        const auditStatusIdx = findColumnIndex(problemHeaders, ["审核状态", "新区状态", "状态"]);
        if (auditStatusIdx === -1) throw new Error("问题区域列表中未找到「审核状态」或「新区状态」列");
        
        // 筛除取消方案
        const validProblemItems = [];
        let cancelledCount = 0;
        for (let i = 1; i < problemListArray.length; i++) {
            const row = problemListArray[i];
            const unicode = unicodeIdx < row.length ? String(row[unicodeIdx]).trim() : "";
            if (!unicode) continue;
            let auditResult = "";
            if (auditResultIdx !== -1) {
                auditResult = auditResultIdx < row.length ? String(row[auditResultIdx]).trim() : "";
                if (auditResult === "取消方案") {
                    cancelledCount++;
                    continue;
                }
            }
            const auditStatus = auditStatusIdx < row.length ? String(row[auditStatusIdx]).trim() : "";
            validProblemItems.push({ unicode, auditStatus });
        }
        setLog('补充匹配-筛除“取消方案”后剩余 ' + validProblemItems.length + ' 条（共排除 ' + cancelledCount + ' 条）');
        if (validProblemItems.length === 0) return [];
        
        // 缺失UNICODE
        const outputHeaders = outputSheet1Array[0].map(h => String(h).trim());
        const districtNoIdx = findColumnIndex(outputHeaders, ["新区编号", "编号"]);
        if (districtNoIdx === -1) throw new Error("输出结果表Sheet1中未找到「新区编号」列");
        const outputSet = new Set();
        for (let i = 1; i < outputSheet1Array.length; i++) {
            const val = outputSheet1Array[i][districtNoIdx] !== undefined ? String(outputSheet1Array[i][districtNoIdx]).trim() : "";
            if (val) outputSet.add(val);
        }
        const missingItems = validProblemItems.filter(item => !outputSet.has(item.unicode));
        setLog('补充匹配-缺失UNICODE数量 ' + missingItems.length);
        if (missingItems.length === 0) return [];
        
        // 联合筛选：交付日期在范围内 + 审核状态符合
        const districtHeaders = districtSheetArray[0].map(h => String(h).trim());
        const numberIdx = findColumnIndex(districtHeaders, ["编号", "新区编号"]);
        const deliveryIdx = findColumnIndex(districtHeaders, ["交付时间", "交付日期"]);
        if (numberIdx === -1 || deliveryIdx === -1) throw new Error("新区数据表中缺少编号或交付时间列");
        
        const deliveryDateSet = new Set(); // 存储编号，其交付日期在范围内
        for (let i = 1; i < districtSheetArray.length; i++) {
            const row = districtSheetArray[i];
            const unicode = numberIdx < row.length ? String(row[numberIdx]).trim() : "";
            if (!unicode) continue;
            const deliveryRaw = deliveryIdx < row.length ? row[deliveryIdx] : "";
            const deliveryDate = convertToDate(deliveryRaw);
            if (deliveryDate && deliveryDate >= startDate && deliveryDate <= endDate) {
                deliveryDateSet.add(unicode);
            }
        }
        setLog('补充匹配-交付日期在 ' + startDateStr + ' 至 ' + endDateStr + ' 内的编号数量: ' + deliveryDateSet.size);
        
        const validUnicodes = [];
        for (const item of missingItems) {
            if (deliveryDateSet.has(item.unicode) && 
                (item.auditStatus === "省公司审核中" || item.auditStatus === "已完成")) {
                validUnicodes.push(item.unicode);
            }
        }
        setLog('补充匹配-联合筛选后剩余 ' + validUnicodes.length);
        if (validUnicodes.length === 0) return [];
        
        // 规划方案列表匹配
        const planHeaders = planListArray[0].map(h => String(h).trim());
        const planKeyIdx = findColumnIndex(planHeaders, ["问题编码", "问题编号", "UNICODE", "unicode", "编码"]);
        if (planKeyIdx === -1) throw new Error("规划方案列表中未找到匹配列");
        const baseStationIdx = findColumnIndex(planHeaders, ["基站名", "基站名称", "需求名称"]);
        const reqSerialIdx = findColumnIndex(planHeaders, ["需求库序号", "需求库编号", "库序号"]);
        const techTypeIdx = findColumnIndex(planHeaders, ["制式", "技术制式", "网络制式"]);
        if (reqSerialIdx === -1) setLog("警告: 规划方案列表中未找到「需求库序号」列");
        if (techTypeIdx === -1) setLog("警告: 规划方案列表中未找到「制式」列");
        
        const validSet = new Set(validUnicodes);
        const filteredPlans = [];
        for (let i = 1; i < planListArray.length; i++) {
            const row = planListArray[i];
            const keyVal = planKeyIdx < row.length ? String(row[planKeyIdx]).trim() : "";
            if (keyVal && validSet.has(keyVal)) {
                filteredPlans.push({
                    unicode: keyVal,
                    rawRow: row,
                    reqSerial: (reqSerialIdx !== -1 && reqSerialIdx < row.length) ? row[reqSerialIdx] : "",
                    techType: (techTypeIdx !== -1 && techTypeIdx < row.length) ? row[techTypeIdx] : "",
                    baseName: (baseStationIdx !== -1 && baseStationIdx < row.length) ? row[baseStationIdx] : ""
                });
            }
        }
        setLog('补充匹配-规划方案匹配行数 ' + filteredPlans.length);
        
        // 新区数据映射
        const districtMap = new Map();
        for (let i = 1; i < districtSheetArray.length; i++) {
            const row = districtSheetArray[i];
            const key = numberIdx < row.length ? String(row[numberIdx]).trim() : "";
            if (key) districtMap.set(key, row);
        }
        const districtIdxMap = {};
        districtHeaders.forEach((h, idx) => { districtIdxMap[h] = idx; });
        const indoorOutdoorIdx = findColumnIndex(districtHeaders, ["室内室外", "室内外", "场景类型"]);
        const fieldsToFetch = ["区域类型", "新区名称", "覆盖场景", "地市", "县市", "交付时间"];
        const sheet2HeaderIdx = {};
        FIXED_SHEET2_HEADERS.forEach((h, idx) => { sheet2HeaderIdx[h] = idx; });
        
        const supplementaryRows = [];
        for (const item of filteredPlans) {
            const districtRow = districtMap.get(item.unicode);
            if (!districtRow) {
                setLog('  警告: 问题编码 ' + item.unicode + ' 在新区数据中不存在，跳过');
                continue;
            }
            const newRow = new Array(FIXED_SHEET2_HEADERS.length).fill("");
            const noIdx = sheet2HeaderIdx["新区编号"];
            if (noIdx !== undefined) newRow[noIdx] = item.unicode;
            
            // 新区类型
            const newTypeIdx = sheet2HeaderIdx["新区类型"];
            if (newTypeIdx !== undefined && indoorOutdoorIdx !== -1) {
                let val = indoorOutdoorIdx < districtRow.length ? districtRow[indoorOutdoorIdx] : "";
                if (val !== undefined && val !== null) newRow[newTypeIdx] = val;
            }
            for (let field of fieldsToFetch) {
                const tgtIdx = sheet2HeaderIdx[field];
                if (tgtIdx !== undefined && districtIdxMap[field] !== undefined) {
                    let val = districtRow[districtIdxMap[field]];
                    if (val instanceof Date) val = XLSX.SSF.format("yyyy-mm-dd", val);
                    if (val !== undefined && val !== null) newRow[tgtIdx] = val;
                }
            }
            // 需求库序号、制式、需求名称从规划方案列表获取
            const reqSerialTgt = sheet2HeaderIdx["需求库序号"];
            if (reqSerialTgt !== undefined && item.reqSerial) newRow[reqSerialTgt] = item.reqSerial;
            const techTypeTgt = sheet2HeaderIdx["制式"];
            if (techTypeTgt !== undefined && item.techType) newRow[techTypeTgt] = item.techType;
            const reqNameIdx = sheet2HeaderIdx["需求名称"];
            if (reqNameIdx !== undefined && item.baseName) newRow[reqNameIdx] = String(item.baseName);
            
            // 需求ID和端到端ID留空
            const reqIdIdx = sheet2HeaderIdx["需求ID"];
            const endToEndIdx = sheet2HeaderIdx["端到端ID"];
            if (reqIdIdx !== undefined) newRow[reqIdIdx] = "";
            if (endToEndIdx !== undefined) newRow[endToEndIdx] = "";
            
            supplementaryRows.push(newRow);
        }
        setLog('补充匹配-成功生成补充行数 ' + supplementaryRows.length);
        return supplementaryRows;
    }
    
    async function executeFullWorkflow() {
        if (!outputWorkbook || !districtWorkbook) {
            setLog("请至少上传「输出结果表」和「新区数据导出」两个文件", true);
            return false;
        }
        try {
            clearLog();
            setLog("开始执行匹配流程...");
            
            const basicRows = generateBasicRows();
            let allRows = [...basicRows];
            
            let hasProblem = (problemWorkbook && problemListArray && planListArray);
            if (hasProblem) {
                setLog("检测到问题区域文件，开始执行补充匹配（交付日期范围将使用上方设置）...");
                const supplementaryRows = generateSupplementaryRows();
                if (supplementaryRows.length > 0) {
                    allRows = allRows.concat(supplementaryRows);
                    setLog('已将 ' + supplementaryRows.length + ' 行补充数据追加到结果末尾');
                } else {
                    setLog("补充匹配未生成任何行（可能无符合条件的数据）");
                }
            } else {
                setLog("未上传问题区域文件，仅输出基础匹配结果");
            }
            
            const finalData = [FIXED_SHEET2_HEADERS, ...allRows];
            const newSheet2 = arrayToSheet(finalData);
            if (outputWorkbook.Sheets["Sheet2"]) delete outputWorkbook.Sheets["Sheet2"];
            outputWorkbook.SheetNames = outputWorkbook.SheetNames.filter(n => n !== "Sheet2");
            outputWorkbook.SheetNames.push("Sheet2");
            outputWorkbook.Sheets["Sheet2"] = newSheet2;
            
            setLog('✅ 成功！共生成 ' + allRows.length + ' 行记录（基础 ' + basicRows.length + ' 行 + 补充 ' + (allRows.length - basicRows.length) + ' 行），已写入Sheet2。');
            return true;
        } catch (err) {
            setLog('执行错误: ' + err.message, true);
            console.error(err);
            return false;
        }
    }
    
    function downloadFinal() {
        if (!outputWorkbook) { setLog("没有可下载的工作簿", true); return; }
        const wbout = XLSX.write(outputWorkbook, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: "application/octet-stream" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '匹配结果_' + new Date().toISOString().slice(0,19).replace(/:/g, '-') + '.xlsx';
        link.click();
        URL.revokeObjectURL(link.href);
        setLog("文件已下载！");
    }
    
    // 事件绑定
    fileOutput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        outputStatusSpan.innerHTML = '📄 解析中...';
        try {
            await loadOutputWorkbook(file);
            outputStatusSpan.innerHTML = '✅ 已加载 (Sheet1)';
            setLog('输出结果表加载成功，共 ' + (outputSheet1Array.length-1) + ' 行。');
        } catch (err) {
            outputStatusSpan.innerHTML = '❌ 失败';
            setLog('输出结果表错误: ' + err.message, true);
            outputWorkbook = null;
        }
    });
    fileDistrict.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        districtStatusSpan.innerHTML = '📂 读取中...';
        try {
            await loadDistrictWorkbook(file);
            districtStatusSpan.innerHTML = '✅ 已加载 (新区数据)';
            setLog('新区数据表加载成功，共 ' + (districtSheetArray.length-1) + ' 行。');
        } catch (err) {
            districtStatusSpan.innerHTML = '❌ 失败';
            setLog('新区数据错误: ' + err.message, true);
            districtWorkbook = null;
        }
    });
    fileProblem.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        problemStatusSpan.innerHTML = '🔍 解析中...';
        try {
            await loadProblemWorkbook(file);
            problemStatusSpan.innerHTML = '✅ 已加载 (双sheet)';
            setLog('问题区域详情加载成功，问题区域列表 ' + (problemListArray.length-1) + ' 行，规划方案列表 ' + (planListArray.length-1) + ' 行。');
        } catch (err) {
            problemStatusSpan.innerHTML = '❌ 失败';
            setLog('问题区域文件错误: ' + err.message, true);
            problemWorkbook = null;
        }
    });
    runBtn.addEventListener('click', async () => {
        if (!outputWorkbook || !districtWorkbook) {
            setLog("请至少上传「输出结果表」和「新区数据导出」两个文件", true);
            return;
        }
        const success = await executeFullWorkflow();
        if (success) downloadFinal();
    });
    resetBtn.addEventListener('click', () => { resetAll(); });
<\/script>
</body>
</html>`;

        .example-link { color: #3b82f6; cursor: pointer; text-decoration: underline; font-size: 0.8rem; margin-left: auto; }
        .status-msg { background: #e6f7e6; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; display: inline-block; }
        footer { margin-top: 32px; text-align: center; font-size: 0.75rem; color: #5b6e8c; }
        .param-opt { margin-top: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: #ffffff; padding: 12px 16px; border-radius: 20px; border: 1px solid #e2edf2; }
        .param-opt label { font-size: 0.85rem; font-weight: 500; color: #1f3a4b; }
        input[type="number"] { width: 90px; padding: 8px 10px; border-radius: 14px; border: 1px solid #cbd5e1; font-size: 0.85rem; text-align: center; }
        .radio-group { display: flex; gap: 24px; align-items: center; margin-top: 8px; margin-bottom: 8px; background: #ffffff; padding: 10px 16px; border-radius: 20px; border: 1px solid #e2edf2; }
        .radio-group span { font-weight: 500; color: #1f3a4b; font-size: 0.85rem; }
        .radio-group label { display: inline-flex; align-items: center; gap: 6px; font-weight: normal; font-size: 0.85rem; cursor: pointer; }
        .action-bar { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin: 28px 0 20px; justify-content: space-between; }
        .action-left { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .btn-group { display: flex; gap: 16px; align-items: center; }
        .encoding-select { display: flex; align-items: center; gap: 8px; }
        .encoding-select label { font-size: 0.85rem; font-weight: 500; color: #1f3a4b; }
        .encoding-select select { padding: 6px 10px; border-radius: 14px; border: 1px solid #cbd5e1; background: white; font-size: 0.85rem; }
        .info-text { font-size: 0.75rem; margin-top: 12px; color: #4b6b8f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 三扇区匹配工具 · 动态方向</h1>
        <div class="sub">先找全局最近站 → 以其方向为基准生成三个120°扇区 → 每个扇区内独立找最近宏站</div>

        <div class="grid-2col">
            <div class="card">
                <h3>📄 原始文件</h3>
                <label class="file-label" for="origFile" id="origLabel">📂 上传原始文件 (CSV/Excel)</label>
                <input type="file" id="origFile" accept=".csv, .xlsx, .xls">
                <div id="origStatus" class="file-status">未上传</div>
                <div class="config-panel">
                    <div class="select-row">
                        <div class="select-group"><label>经度列</label><select id="origLonCol"></select></div>
                        <div class="select-group"><label>纬度列</label><select id="origLatCol"></select></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>🗄️ 工参文件</h3>
                <label class="file-label" for="paramFile" id="paramLabel">📂 上传工参文件 (CSV/Excel)</label>
                <input type="file" id="paramFile" accept=".csv, .xlsx, .xls">
                <div id="paramStatus" class="file-status">未上传</div>
                <div class="config-panel">
                    <div class="select-row">
                        <div class="select-group"><label>经度列</label><select id="paramLonCol"></select></div>
                        <div class="select-group"><label>纬度列</label><select id="paramLatCol"></select></div>
                        <div class="select-group"><label>名称列</label><select id="paramNameCol"></select></div>
                        <div class="select-group"><label>流量列(可选)</label><select id="paramTrafficCol"><option value="">无</option></select></div>
                    </div>

                    <div class="param-opt">
                        <label>🔍 搜索初始半径 (km):</label>
                        <input type="number" id="searchRadiusKm" value="5" step="1" min="0.5">
                    </div>

                    <div class="param-opt">
                        <label>📌 每个扇区最近N个站:</label>
                        <input type="number" id="topN" value="1" min="1" max="99" step="1">
                    </div>

                    <div class="radio-group">
                        <span>去重方式：</span>
                        <label><input type="radio" name="dedupMode" value="none" checked> 不去重</label>
                        <label><input type="radio" name="dedupMode" value="name"> 按名称去重</label>
                        <label><input type="radio" name="dedupMode" value="distance"> 按距离去重</label>
                    </div>

                    <div class="info-text">📡 有效工参点：<span id="paramCount">0</span> 个</div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <div class="action-left">
                <div class="encoding-select">
                    <label for="csvEncoding">📄 CSV编码：</label>
                    <select id="csvEncoding">
                        <option value="utf-8">UTF-8</option>
                        <option value="gbk">GBK</option>
                    </select>
                </div>
                <button id="runMatchBtn">⚡ 开始匹配 (三扇区)</button>
            </div>
            <div class="example-link" id="downloadSample">📎 下载示例数据模板</div>
        </div>

        <div id="progressArea" style="display: none;">
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <div id="progressText" style="font-size:0.85rem; margin-bottom: 12px;"></div>
        </div>
        <div id="messageArea" class="status-msg" style="margin-bottom: 12px;"></div>

        <footer>⚡ CSV文件如遇乱码，请尝试切换编码后重新上传。</footer>
    </div>

    <script>
        (function() {
            // 全局变量
            let rawData = null, rawHeaders = [];
            let paramData = null, paramHeaders = [];
            let gridIndex = new Map();
            let paramPointsList = [];
            const GRID_SIZE_DEG = 0.05;
            let searchRadiusKm = 5;
            let topN = 1;
            let dedupMode = "none";
            let isMatching = false;
            const EARTH_RADIUS_KM = 6371.0;
            let currentOrigFile = null, currentParamFile = null;

            // 辅助函数
            function toRad(deg) { return deg * Math.PI / 180; }
            function haversineDistance(lon1, lat1, lon2, lat2) {
                const φ1 = toRad(lat1), φ2 = toRad(lat2);
                const Δφ = toRad(lat2 - lat1);
                const Δλ = toRad(lon2 - lon1);
                const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return EARTH_RADIUS_KM * c * 1000;
            }
            function calculateBearing(lon1, lat1, lon2, lat2) {
                const φ1 = toRad(lat1), φ2 = toRad(lat2);
                const Δλ = toRad(lon2 - lon1);
                const x = Math.sin(Δλ) * Math.cos(φ2);
                const y = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
                let brng = Math.atan2(x, y) * 180 / Math.PI;
                return (brng + 360) % 360;
            }
            function angleDifference(a1, a2) { let d = Math.abs(a1 - a2) % 360; return Math.min(d, 360-d); }

            // 解析CSV手动
            function parseCSVManual(text, delimiter) {
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                if (!delimiter) {
                    const firstLine = text.split(/\\r?\\n/)[0] || '';
                    delimiter = (firstLine.match(/\\t/g) || []).length > (firstLine.match(/,/g) || []).length ? '\\t' : ',';
                }
                const rows = [];
                let currentRow = [], currentField = '', inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    if (inQuotes) {
                        if (ch === '"') {
                            if (i + 1 < text.length && text[i + 1] === '"') { currentField += '"'; i++; }
                            else inQuotes = false;
                        } else currentField += ch;
                    } else {
                        if (ch === '"') inQuotes = true;
                        else if (ch === delimiter) { currentRow.push(currentField); currentField = ''; }
                        else if (ch === '\\r') { if (i + 1 < text.length && text[i + 1] === '\\n') i++; currentRow.push(currentField); currentField = ''; rows.push(currentRow); currentRow = []; }
                        else if (ch === '\\n') { currentRow.push(currentField); currentField = ''; rows.push(currentRow); currentRow = []; }
                        else currentField += ch;
                    }
                }
                currentRow.push(currentField);
                if (currentRow.length || currentField) rows.push(currentRow);
                return rows.filter(row => row.some(cell => cell.trim() !== ''));
            }

            function csvToJSON(rows) {
                if (rows.length < 2) return { data: [], headers: [] };
                const headers = rows[0].map(h => h.trim());
                const data = rows.slice(1).map(row => {
                    const obj = {};
                    headers.forEach((h, c) => { obj[h] = (c < row.length) ? row[c] : ''; });
                    return obj;
                });
                return { data, headers };
            }

            function filterEmptyColumns(data, headers) {
                if (!data.length) return { filteredData: data, filteredHeaders: headers };
                const hasValue = new Array(headers.length).fill(false);
                for (let row of data) {
                    for (let idx = 0; idx < headers.length; idx++) {
                        if (hasValue[idx]) continue;
                        const val = row[headers[idx]];
                        if (val !== undefined && val !== null && val !== '') hasValue[idx] = true;
                    }
                    if (hasValue.every(v => v)) break;
                }
                const keepIndices = hasValue.reduce((arr, v, i) => { if (v) arr.push(i); return arr; }, []);
                if (keepIndices.length === headers.length) return { filteredData: data, filteredHeaders: headers };
                const newHeaders = keepIndices.map(i => headers[i]);
                const newData = data.map(row => {
                    const newRow = {};
                    keepIndices.forEach(i => newRow[headers[i]] = row[headers[i]]);
                    return newRow;
                });
                return { filteredData: newData, filteredHeaders: newHeaders };
            }

            // 智能列匹配
            const lonPatterns = ['^lon$','^lng$','^longitude$','经度','long','x','easting'];
            const latPatterns = ['^lat$','^latitude$','纬度','lat','y','northing'];
            const namePatterns = ['^name$','^site$','^站名$','^基站名$','名称','站点'];
            const trafficPatterns = ['流量','业务量','traffic','throughput'];
            function autoSelectCol(headers, type) {
                const patterns = { lon: lonPatterns, lat: latPatterns, name: namePatterns, traffic: trafficPatterns }[type] || [];
                for (let p of patterns) {
                    const regex = new RegExp(p, 'i');
                    const found = headers.find(h => regex.test(h));
                    if (found) return found;
                }
                return '';
            }
            function populateSelect(selectEl, headers, type, withNone = false) {
                selectEl.innerHTML = '';
                if (withNone) { const opt = new Option('无', ''); selectEl.appendChild(opt); }
                headers.forEach(h => selectEl.appendChild(new Option(h, h)));
                const auto = autoSelectCol(headers, type);
                if (auto && headers.includes(auto)) selectEl.value = auto;
                else if (headers.length && !withNone) selectEl.value = headers[0];
            }

            // 文件解析
            function parseFile(file, encoding) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const buffer = e.target.result;
                            if (file.name.toLowerCase().endsWith('.csv')) {
                                const decoder = encoding === 'gbk' ? new TextDecoder('gbk') : new TextDecoder('utf-8');
                                const text = decoder.decode(buffer);
                                const rows = parseCSVManual(text);
                                if (rows.length < 2) throw new Error('CSV数据不足');
                                const { data, headers } = csvToJSON(rows);
                                const { filteredData, filteredHeaders } = filterEmptyColumns(data, headers);
                                resolve({ data: filteredData, headers: filteredHeaders });
                            } else {
                                const wb = XLSX.read(buffer, { type: 'array', defval: '' });
                                const sheet = wb.Sheets[wb.SheetNames[0]];
                                const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                                if (!rows.length) throw new Error('空数据');
                                const headers = Object.keys(rows[0]);
                                const { filteredData, filteredHeaders } = filterEmptyColumns(rows, headers);
                                resolve({ data: filteredData, headers: filteredHeaders });
                            }
                        } catch (err) { reject(err); }
                    };
                    reader.onerror = () => reject(new Error('读取失败'));
                    reader.readAsArrayBuffer(file);
                });
            }

            // 更新界面
            async function processFile(file, isOrig) {
                if (!file) return;
                const statusDiv = document.getElementById(isOrig ? 'origStatus' : 'paramStatus');
                statusDiv.innerText = '⏳ 解析中...';
                try {
                    const enc = document.getElementById('csvEncoding').value;
                    const { data, headers } = await parseFile(file, enc);
                    if (isOrig) { rawData = data; rawHeaders = headers; }
                    else { paramData = data; paramHeaders = headers; }
                    statusDiv.innerText = \`✅ 已加载 \${data.length} 行，列 \${headers.length} 个\`;
                    if (isOrig) {
                        populateSelect(document.getElementById('origLonCol'), headers, 'lon');
                        populateSelect(document.getElementById('origLatCol'), headers, 'lat');
                    } else {
                        populateSelect(document.getElementById('paramLonCol'), headers, 'lon');
                        populateSelect(document.getElementById('paramLatCol'), headers, 'lat');
                        populateSelect(document.getElementById('paramNameCol'), headers, 'name');
                        populateSelect(document.getElementById('paramTrafficCol'), headers, 'traffic', true);
                        // 更新工参点计数
                        const lonCol = document.getElementById('paramLonCol').value;
                        const latCol = document.getElementById('paramLatCol').value;
                        let cnt = 0;
                        if (lonCol && latCol) {
                            for (let row of paramData) {
                                const lon = parseFloat(row[lonCol]), lat = parseFloat(row[latCol]);
                                if (!isNaN(lon) && !isNaN(lat) && lon >= -180 && lon <= 180 && lat >= -90 && lat <= 90) cnt++;
                            }
                        }
                        document.getElementById('paramCount').innerText = cnt;
                    }
                } catch (err) {
                    console.error(err);
                    statusDiv.innerText = \`❌ 解析失败: \${err.message}\`;
                }
            }

            // 绑定事件
            function setupFileInput(id, labelId, isOrig) {
                const input = document.getElementById(id);
                const label = document.getElementById(labelId);
                if (!input || !label) return;
                // 点击 label 触发 input（for属性已处理，这里做备用）
                label.addEventListener('click', (e) => {
                    e.preventDefault();
                    input.click();
                });
                input.addEventListener('change', function() {
                    if (this.files.length) {
                        const file = this.files[0];
                        if (isOrig) currentOrigFile = file;
                        else currentParamFile = file;
                        processFile(file, isOrig);
                    }
                });
            }

            // 主匹配与下载（略，已在前文）
            function buildGridIndex(points) {
                gridIndex.clear();
                for (let pt of points) {
                    const lonIdx = Math.floor(pt.lon / GRID_SIZE_DEG);
                    const latIdx = Math.floor(pt.lat / GRID_SIZE_DEG);
                    const key = \`\${lonIdx},\${latIdx}\`;
                    if (!gridIndex.has(key)) gridIndex.set(key, []);
                    gridIndex.get(key).push(pt);
                }
            }

            function getNearbyPoints(lon, lat, maxExpand = 3) {
                const lonIdx = Math.floor(lon / GRID_SIZE_DEG);
                const latIdx = Math.floor(lat / GRID_SIZE_DEG);
                let candidates = [];
                for (let dx = -maxExpand; dx <= maxExpand; dx++)
                    for (let dy = -maxExpand; dy <= maxExpand; dy++) {
                        const key = \`\${lonIdx+dx},\${latIdx+dy}\`;
                        if (gridIndex.has(key)) candidates.push(...gridIndex.get(key));
                    }
                return candidates;
            }

            function getAllCandidatesInRadius(origLon, origLat, initialRadiusKm) {
                let radius = initialRadiusKm, maxRadius = 100;
                let candidates = [];
                const nearby = getNearbyPoints(origLon, origLat, 3);
                while (radius <= maxRadius) {
                    candidates = nearby.filter(p => haversineDistance(origLon, origLat, p.lon, p.lat) / 1000 <= radius);
                    if (candidates.length) break;
                    radius *= 2;
                }
                if (!candidates.length) return [];
                return candidates.map(p => {
                    const dist = haversineDistance(origLon, origLat, p.lon, p.lat);
                    const bearing = calculateBearing(origLon, origLat, p.lon, p.lat);
                    return { ...p, distance_m: dist, bearing };
                }).sort((a, b) => a.distance_m - b.distance_m);
            }

            function deduplicateCandidates(candidates, mode) {
                if (mode === 'none') return candidates;
                if (mode === 'name') {
                    const seen = new Set();
                    return candidates.filter(c => { if (seen.has(c.name)) return false; seen.add(c.name); return true; });
                }
                if (mode === 'distance') return candidates.filter(c => c.distance_m > 0.001);
                return candidates;
            }

            function filterBySector(candidates, centerAz) {
                return candidates.filter(c => angleDifference(centerAz, c.bearing) <= 60);
            }

            function matchThreeSectors(origLon, origLat, topN, dedupMode, initialRadiusKm) {
                const all = getAllCandidatesInRadius(origLon, origLat, initialRadiusKm);
                if (!all.length) return { sectors: [] };
                const baseAz = all[0].bearing;
                const centers = [baseAz, (baseAz + 120) % 360, (baseAz + 240) % 360];
                const sectors = centers.map((centerAz, idx) => {
                    let sectorCands = filterBySector(all, centerAz);
                    if (!sectorCands.length) return { sectorIndex: idx, centerAzimuth: centerAz, matches: [] };
                    sectorCands = deduplicateCandidates(sectorCands, dedupMode).slice(0, topN);
                    return { sectorIndex: idx, centerAzimuth: centerAz, matches: sectorCands };
                });
                return { sectors };
            }

            async function runMatch() {
                if (isMatching) return;
                if (!rawData || !paramData) { alert('请先上传两个文件'); return; }
                const origLonCol = document.getElementById('origLonCol').value;
                const origLatCol = document.getElementById('origLatCol').value;
                const paramLonCol = document.getElementById('paramLonCol').value;
                const paramLatCol = document.getElementById('paramLatCol').value;
                const paramNameCol = document.getElementById('paramNameCol').value;
                const paramTrafficCol = document.getElementById('paramTrafficCol').value;
                searchRadiusKm = parseFloat(document.getElementById('searchRadiusKm').value) || 5;
                topN = parseInt(document.getElementById('topN').value) || 1;
                dedupMode = document.querySelector('input[name="dedupMode"]:checked')?.value || 'none';

                const validParams = paramData.map(row => ({
                    lon: parseFloat(row[paramLonCol]), lat: parseFloat(row[paramLatCol]),
                    name: row[paramNameCol] || '',
                    traffic: paramTrafficCol ? row[paramTrafficCol] || '' : '',
                    rawObj: row
                })).filter(p => !isNaN(p.lon) && !isNaN(p.lat) && Math.abs(p.lon) <= 180 && Math.abs(p.lat) <= 90);

                if (!validParams.length) { alert('工参无有效经纬度'); return; }
                paramPointsList = validParams;
                buildGridIndex(validParams);
                document.getElementById('paramCount').innerText = validParams.length;

                const total = rawData.length;
                if (total > 5000 && !confirm(\`原始点 \${total} 个，可能较慢，继续？\`)) return;
                isMatching = true;
                const btn = document.getElementById('runMatchBtn');
                btn.disabled = true; btn.textContent = '匹配中...';
                document.getElementById('progressArea').style.display = 'block';
                const fill = document.getElementById('progressFill');
                const text = document.getElementById('progressText');
                const msg = document.getElementById('messageArea');
                msg.innerText = '匹配进行中...';
                const outputRows = [];
                const chunkSize = 50;
                for (let start = 0; start < total; start += chunkSize) {
                    const end = Math.min(start + chunkSize, total);
                    for (let i = start; i < end; i++) {
                        const row = rawData[i];
                        const lon = parseFloat(row[origLonCol]), lat = parseFloat(row[origLatCol]);
                        if (isNaN(lon) || isNaN(lat) || Math.abs(lon) > 180 || Math.abs(lat) > 90) {
                            outputRows.push({ rawRow: row, sectorIndex: null, centerAzimuth: null, match: null, rank: null, warning: '经纬度无效' });
                            continue;
                        }
                        const { sectors } = matchThreeSectors(lon, lat, topN, dedupMode, searchRadiusKm);
                        if (!sectors.length) outputRows.push({ rawRow: row, sectorIndex: null, centerAzimuth: null, match: null, rank: null, warning: '无工参点' });
                        else sectors.forEach(s => {
                            if (!s.matches.length) outputRows.push({ rawRow: row, sectorIndex: s.sectorIndex, centerAzimuth: s.centerAzimuth, match: null, rank: null, warning: '扇区无点' });
                            else s.matches.forEach((m, idx) => outputRows.push({ rawRow: row, sectorIndex: s.sectorIndex, centerAzimuth: s.centerAzimuth, match: m, rank: idx + 1, warning: null }));
                        });
                    }
                    fill.style.width = (end / total * 100) + '%';
                    text.innerText = \`进度 \${end}/\${total}，已生成 \${outputRows.length} 行\`;
                    await new Promise(r => setTimeout(r, 5));
                }
                generateCSV(outputRows);
                msg.innerText = \`完成！原始 \${total} 点，结果 \${outputRows.length} 行。\`;
                document.getElementById('progressArea').style.display = 'none';
                isMatching = false;
                btn.disabled = false; btn.textContent = '⚡ 开始匹配 (三扇区)';
            }

            function generateCSV(outputRows) {
                const headers = [...rawHeaders, '扇区编号','扇区中心方位角','匹配序号','匹配工参名称','匹配工参经度','匹配工参纬度','匹配工参流量','距离(米)','工参方位角','备注'];
                const rows = outputRows.map(item => {
                    const rawVals = rawHeaders.map(h => item.rawRow[h] ?? '');
                    const sectorIdx = item.sectorIndex ?? '';
                    const centerAz = item.centerAzimuth != null ? item.centerAzimuth.toFixed(1) : '';
                    const rank = item.rank ?? '';
                    if (!item.match) return [...rawVals, sectorIdx, centerAz, rank, '', '', '', '', '', '', item.warning || ''];
                    const m = item.match;
                    return [...rawVals, sectorIdx, centerAz, rank, m.name, m.lon.toFixed(6), m.lat.toFixed(6), m.traffic || '', m.distance_m.toFixed(2), m.bearing.toFixed(2), item.warning || ''];
                });
                const csv = '\uFEFF' + headers.join(',') + '\\n' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = \`three_sector_result_\${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv\`;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            // 示例下载
            function downloadSample() {
                const orig = '原始经度,原始纬度,站点名称\\n120.123,30.234,测试站A\\n120.456,30.567,测试站B';
                const param = '工参经度,工参纬度,基站名称,流量(MB)\\n120.122,30.233,近点1,1250.5\\n120.130,30.240,近点2,890.2';
                [orig, param].forEach((txt, i) => {
                    const blob = new Blob(['\uFEFF' + txt], { type: 'text/csv;charset=utf-8;' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = i === 0 ? 'sample_original.csv' : 'sample_parameter.csv';
                    a.click();
                    URL.revokeObjectURL(a.href);
                });
            }

'                }\n' +
'\n' +
'                const latestWindowKey = windows[0].key;\n' +
'\n' +
'                const cgiMap = new Map();\n' +
'                validRows.forEach(r => {\n' +
'                    const cgi = r.cgiStr;\n' +
'                    if (!cgiMap.has(cgi)) {\n' +
'                        cgiMap.set(cgi, {\n' +
'                            stationType: r.stationType,\n' +
'                            is5G: r.is5G,\n' +
'                            label: null,\n' +
'                            remark: \'\',\n' +
'                            dailyTraffic: new Map()\n' +
'                        });\n' +
'                    }\n' +
'                    const info = cgiMap.get(cgi);\n' +
'                    const ds = formatDate(r.dateObj);\n' +
'                    if (!info.dailyTraffic.has(ds) || r.traffic > info.dailyTraffic.get(ds)) {\n' +
'                        info.dailyTraffic.set(ds, r.traffic);\n' +
'                    }\n' +
'                    if (!info.stationType) info.stationType = r.stationType;\n' +
'                });\n' +
'\n' +
'                const fiveGCGIs = Array.from(cgiMap.keys()).filter(cgi => cgiMap.get(cgi).is5G);\n' +
'                if (fiveGCGIs.length > 0) {\n' +
'                    for (const cgi of fiveGCGIs) {\n' +
'                        const info = cgiMap.get(cgi);\n' +
'                        const windowMap = new Map();\n' +
'\n' +
'                        for (const [dateStr, traffic] of info.dailyTraffic) {\n' +
'                            const d = new Date(dateStr);\n' +
'                            const win = windows.find(w => d >= w.start && d <= w.end);\n' +
'                            if (win) {\n' +
'                                if (!windowMap.has(win.key)) {\n' +
'                                    windowMap.set(win.key, {\n' +
'                                        trafficByDate: new Map(),\n' +
'                                        stationType: info.stationType\n' +
'                                    });\n' +
'                                }\n' +
'                                windowMap.get(win.key).trafficByDate.set(dateStr, traffic);\n' +
'                            }\n' +
'                        }\n' +
'\n' +
'                        const sortedWindowKeys = windows.map(w => w.key).filter(key => windowMap.has(key));\n' +
'                        if (sortedWindowKeys.length === 0) continue;\n' +
'\n' +
'                        let judgeWindowKey = null;\n' +
'                        for (const winKey of windows.map(w => w.key)) {\n' +
'                            if (windowMap.has(winKey) && windowMap.get(winKey).trafficByDate.size >= MIN_DAYS_PER_WEEK) {\n' +
'                                judgeWindowKey = winKey;\n' +
'                                break;\n' +
'                            }\n' +
'                        }\n' +
'\n' +
'                        if (!judgeWindowKey) {\n' +
'                            info.label = \'缺失数据过多，建议手动核查\';\n' +
'                            info.remark = \'\';\n' +
'                            continue;\n' +
'                        }\n' +
'\n' +
'                        const windowStatuses = new Map();\n' +
'                        for (const [winKey, winData] of windowMap) {\n' +
'                            const tbd = winData.trafficByDate;\n' +
'                            if (tbd.size === 0) {\n' +
'                                windowStatuses.set(winKey, \'no_data\');\n' +
'                                continue;\n' +
'                            }\n' +
'                            const arr = Array.from(tbd.entries()).map(([ds, tr]) => {\n' +
'                                const day = new Date(ds);\n' +
'                                return { date: day, traffic: tr, dayType: getDayType(day) };\n' +
'                            });\n' +
'                            let zeroWD = 0, zeroWE = 0;\n' +
'                            arr.forEach(item => {\n' +
'                                if (item.traffic === 0) {\n' +
'                                    item.dayType === \'workday\' ? zeroWD++ : zeroWE++;\n' +
'                                }\n' +
'                            });\n' +
'                            const isZero = (zeroWD >= 2) && (zeroWE >= 1);\n' +
'                            let isLow = false;\n' +
'                            if (!isZero) {\n' +
'                                const sortedTraffic = arr.map(i => i.traffic).sort((a,b)=>b-a);\n' +
'                                const top3 = sortedTraffic.slice(0,3);\n' +
'                                if (top3.length) {\n' +
'                                    const avg = top3.reduce((s,v)=>s+v,0)/top3.length;\n' +
'                                    const st = winData.stationType;\n' +
'                                    if (isIndoorSite(st)) {\n' +
'                                        if (avg < 2) isLow = true;\n' +
'                                    } else {\n' +
'                                        if (avg < 3) isLow = true;\n' +
'                                    }\n' +
'                                }\n' +
'                            }\n' +
'                            windowStatuses.set(winKey, isZero ? \'zero\' : (isLow ? \'low\' : \'qualified\'));\n' +
'                        }\n' +
'\n' +
'                        const judgeStatus = windowStatuses.get(judgeWindowKey);\n' +
'                        let label = judgeStatus === \'zero\' ? \'零效益小区\' : (judgeStatus === \'low\' ? \'低效益小区\' : \'非零低小区\');\n' +
'\n' +
'                        let remark = \'\';\n' +
'                        if (judgeWindowKey !== latestWindowKey) {\n' +
'                            remark = \'最新周有空值数据，建议核查\';\n' +
'                        }\n' +
'                        if (label === \'零效益小区\' || label === \'低效益小区\') {\n' +
'                            let hasQualified = false;\n' +
'                            for (const [wk, status] of windowStatuses) {\n' +
'                                if (wk !== judgeWindowKey && status === \'qualified\') { hasQualified = true; break; }\n' +
'                            }\n' +
'                            if (hasQualified) {\n' +
'                                remark += (remark ? \'；\' : \'\') + \'该小区有数据达标周\';\n' +
'                            }\n' +
'                        }\n' +
'                        info.label = label;\n' +
'                        info.remark = remark;\n' +
'                    }\n' +
'                }\n' +
'\n' +
'                for (const [cgi, info] of cgiMap) {\n' +
'                    if (!info.is5G) {\n' +
'                        info.label = \'非5G小区\';\n' +
'                        info.remark = \'\';\n' +
'                    } else if (info.label === null) {\n' +
'                        info.label = \'非零低小区\';\n' +
'                        info.remark = \'\';\n' +
'                    }\n' +
'                }\n' +
'\n' +
'                const pivotHeaders = [\'CGI\', \'站型\', \'标签\', \'备注\', ...allDates];\n' +
'                const pivotRows = [];\n' +
'                Array.from(cgiMap.keys()).sort().forEach(cgi => {\n' +
'                    const info = cgiMap.get(cgi);\n' +
'                    const row = [cgi, info.stationType || \'\', info.label, info.remark];\n' +
'                    allDates.forEach(d => row.push(info.dailyTraffic.has(d) ? info.dailyTraffic.get(d) : \'\'));\n' +
'                    pivotRows.push(row);\n' +
'                });\n' +
'                return { pivotHeaders, pivotRows };\n' +
'            }\n' +
'\n' +
'            const fileInput = document.getElementById(\'fileInput\');\n' +
'            const uploadArea = document.getElementById(\'uploadArea\');\n' +
'            const fileNameDiv = document.getElementById(\'fileName\');\n' +
'            const processBtn = document.getElementById(\'processBtn\');\n' +
'            const statusDiv = document.getElementById(\'statusMessage\');\n' +
'\n' +
'            function setSelectedFile(file) {\n' +
'                if (!file) return;\n' +
'                if (!file.name.match(/\.(xlsx|xls)$/i)) {\n' +
'                    statusDiv.innerHTML = \'❌ 请上传Excel文件（.xlsx或.xls）\';\n' +
'                    statusDiv.className = \'status error\';\n' +
'                    processBtn.disabled = true;\n' +
'                    return;\n' +
'                }\n' +
'                selectedFile = file;\n' +
'                fileNameDiv.textContent = \'已选择文件：\' + file.name;\n' +
'                processBtn.disabled = false;\n' +
'                statusDiv.innerHTML = \'\';\n' +
'            }\n' +
'\n' +
'            uploadArea.addEventListener(\'dragover\', e => { e.preventDefault(); uploadArea.style.borderColor = \'#3498db\'; });\n' +
'            uploadArea.addEventListener(\'dragleave\', () => uploadArea.style.borderColor = \'#bdc3c7\');\n' +
'            uploadArea.addEventListener(\'drop\', e => {\n' +
'                e.preventDefault();\n' +
'                uploadArea.style.borderColor = \'#bdc3c7\';\n' +
'                const files = e.dataTransfer.files;\n' +
'                if (files.length) {\n' +
'                    fileInput.files = files;\n' +
'                    setSelectedFile(files[0]);\n' +
'                }\n' +
'            });\n' +
'            fileInput.addEventListener(\'change\', e => {\n' +
'                if (e.target.files.length) setSelectedFile(e.target.files[0]);\n' +
'            });\n' +
'\n' +
'            processBtn.addEventListener(\'click\', () => {\n' +
'                if (!selectedFile) return;\n' +
'                processBtn.disabled = true;\n' +
'                statusDiv.innerHTML = \'⏳ 正在分析数据...\';\n' +
'                startProgress();\n' +
'\n' +
'                const reader = new FileReader();\n' +
'                reader.onload = function(e) {\n' +
'                    try {\n' +
'                        const data = new Uint8Array(e.target.result);\n' +
'                        const workbook = XLSX.read(data, { type: \'array\' });\n' +
'                        const firstSheet = workbook.SheetNames[0];\n' +
'                        const sheet = workbook.Sheets[firstSheet];\n' +
'                        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });\n' +
'                        if (json.length < 2) throw new Error(\'表格至少需要包含表头和一行数据。\');\n' +
'\n' +
'                        const headers = json[0].map(h => String(h).trim());\n' +
'                        const dateIdx = findColumnIndex(headers, [\'日期\', \'时间\', \'date\', \'time\']);\n' +
'                        const cgiIdx = findColumnIndex(headers, [\'cgi\', \'小区\', \'cell\', \'id\']);\n' +
'                        const trafficIdx = findColumnIndex(headers, [\'流量\', \'业务量\', \'traffic\', \'throughput\', \'数据流量\']);\n' +
'                        const stationIdx = findColumnIndex(headers, [\'站型\', \'类型\', \'覆盖\', \'station type\', \'site type\', \'站型\']);\n' +
'\n' +
'                        if (dateIdx === -1) throw new Error(\'未找到“日期”列。当前表头：\' + headers.join(\', \'));\n' +
'                        if (cgiIdx === -1) throw new Error(\'未找到“CGI”或“ID”列。当前表头：\' + headers.join(\', \'));\n' +
'                        if (trafficIdx === -1) throw new Error(\'未找到“流量”列。当前表头：\' + headers.join(\', \'));\n' +
'                        if (stationIdx === -1) throw new Error(\'未找到“站型”列。当前表头：\' + headers.join(\', \'));\n' +
'\n' +
'                        const rawRows = [];\n' +
'                        for (let i = 1; i < json.length; i++) {\n' +
'                            const row = json[i];\n' +
'                            if (!row || row.length === 0) continue;\n' +
'                            const dateVal = row[dateIdx], cgiVal = row[cgiIdx];\n' +
'                            if (dateVal === undefined || cgiVal === undefined) continue;\n' +
'                            rawRows.push({\n' +
'                                date: dateVal,\n' +
'                                cgi: cgiVal,\n' +
'                                traffic: row[trafficIdx],\n' +
'                                stationType: row[stationIdx]\n' +
'                            });\n' +
'                        }\n' +
'                        if (!rawRows.length) throw new Error(\'没有有效数据行。\');\n' +
'\n' +
'                        setTimeout(() => {\n' +
'                            try {\n' +
'                                const { pivotHeaders, pivotRows } = analyzeAndPivot(rawRows);\n' +
'                                const newWorkbook = XLSX.utils.book_new();\n' +
'                                const origSheetData = [headers, ...rawRows.map(r => [r.date, r.cgi, r.traffic, r.stationType])];\n' +
'                                XLSX.utils.book_append_sheet(newWorkbook, XLSX.utils.aoa_to_sheet(origSheetData), firstSheet);\n' +
'                                XLSX.utils.book_append_sheet(newWorkbook, XLSX.utils.aoa_to_sheet([pivotHeaders, ...pivotRows]), \'分析结果\');\n' +
'                                XLSX.writeFile(newWorkbook, \'5G小区效益分析结果.xlsx\');\n' +
'                                finishProgress();\n' +
'                                statusDiv.innerHTML = \'✅ 分析完成！文件已自动下载。\';\n' +
'                                statusDiv.className = \'status success\';\n' +
'                                processBtn.disabled = false;\n' +
'                            } catch (err) {\n' +
'                                finishProgress();\n' +
'                                statusDiv.innerHTML = \'❌ 分析失败: \' + err.message;\n' +
'                                statusDiv.className = \'status error\';\n' +
'                                processBtn.disabled = false;\n' +
'                            }\n' +
'                        }, 100);\n' +
'                    } catch (err) {\n' +
'                        finishProgress();\n' +
'                        statusDiv.innerHTML = \'❌ 文件处理错误: \' + err.message;\n' +
'                        statusDiv.className = \'status error\';\n' +
'                        processBtn.disabled = false;\n' +
'                    }\n' +
'                };\n' +
'                reader.onerror = () => {\n' +
'                    finishProgress();\n' +
'                    statusDiv.innerHTML = \'❌ 文件读取失败\';\n' +
'                    statusDiv.className = \'status error\';\n' +
'                    processBtn.disabled = false;\n' +
'                };\n' +
'                reader.readAsArrayBuffer(selectedFile);\n' +
'            });\n' +
'        })();\n' +
'    <\/script>\n' +
'</body>\n' +
'</html>';

            // ==================== 创建Blob URL ====================
            function createBlobURL(htmlString, index) {
                if (blobURLs[index]) {
                    URL.revokeObjectURL(blobURLs[index]);
                }
                const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
                blobURLs[index] = URL.createObjectURL(blob);
                return blobURLs[index];
            }

            // ==================== 加载iframe ====================
            function loadPanel(panelIndex) {
                if (loadedFlags[panelIndex]) return; // 已加载
                const panel = document.getElementById('panel' + panelIndex);
                const placeholder = panel.querySelector('.loading-placeholder');
                if (!placeholder) return;

                // 创建iframe
                const iframe = document.createElement('iframe');
                iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;background:#fdfdfd;';
                iframe.title = '工具' + (panelIndex + 1);
                iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals';

                // 设置src为Blob URL
                const url = createBlobURL(toolHTMLs[panelIndex], panelIndex);
                iframe.src = url;

                // 替换loading占位符
                panel.innerHTML = '';
                panel.appendChild(iframe);
                loadedFlags[panelIndex] = true;
            }

            // ==================== 标签切换 ====================
            function switchTab(tabIndex) {
                if (tabIndex === currentTab) return;

                // 更新标签按钮状态
                tabBtns.forEach((btn, i) => {
                    btn.classList.toggle('active', i === tabIndex);
                });

                // 更新面板显示
                panels.forEach((panel, i) => {
                    panel.classList.toggle('active', i === tabIndex);
                });

                // 延迟加载iframe（如果尚未加载）
                loadPanel(tabIndex);

                currentTab = tabIndex;
            }

            // ==================== 绑定标签点击事件 ====================
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabIndex = parseInt(this.getAttribute('data-tab'));
                    if (!isNaN(tabIndex) && tabIndex >= 0 && tabIndex < 6) {
                        switchTab(tabIndex);
                    }
                });
            });

            // ==================== 初始加载 ====================
            // 默认加载第一个工具
            loadPanel(0);
            loadedFlags[0] = true;
            // 将第一个面板的loading替换为iframe
            const panel0 = document.getElementById('panel0');
            const placeholder0 = panel0.querySelector('.loading-placeholder');
            if (placeholder0) {
                const iframe0 = document.createElement('iframe');
                iframe0.style.cssText = 'width:100%;height:100%;border:none;display:block;background:#fdfdfd;';
                iframe0.title = '工具1';
                iframe0.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals';
                iframe0.src = createBlobURL(toolHTMLs[0], 0);
                panel0.innerHTML = '';
                panel0.appendChild(iframe0);
            }

            // ==================== 键盘导航 ====================
            document.addEventListener('keydown', function(e) {
                // Ctrl+数字切换标签
                if (e.ctrlKey && e.key >= '1' && e.key <= '6') {
                    e.preventDefault();
                    const idx = parseInt(e.key) - 1;
                    switchTab(idx);
                }
            });

            // ==================== 清理 ====================
            window.addEventListener('beforeunload', function() {
                blobURLs.forEach(url => {
                    if (url) URL.revokeObjectURL(url);
                });
            });

            console.log('✅ Arvinlwj 工具集合页已就绪 | 6个工具 | 标签切换 | Blob URL隔离');
            console.log('   [1] 新区清单梳理  [2] 方案关联匹配  [3] 工参邻近匹配  [4] KML转CSV  [5] 表格拆分 [6] 5G效益分析');
            console.log('   💡 提示：使用 Ctrl+1~6 可快速切换工具标签');
        })();
    </script>
</body>
</html>
